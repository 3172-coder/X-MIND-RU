<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детерминизм Квиз</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #181a20;
      --card-inner: #21242d;
      --accent-blue: #3b82f6;
      --accent-hover: #2563eb;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --correct-green: #10b981;
      --incorrect-red: #ef4444;
      --border-color: #2b303c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Холст анимации «Матрицы» */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .main-title {
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      margin-bottom: 24px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .quiz-card {
      position: relative;
      z-index: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--text-secondary);
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .music-toggle-btn {
      background-color: var(--card-inner);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-toggle-btn:hover {
      background-color: #2b303c;
    }

    .question-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .option-item {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .option-item:hover:not(.locked) {
      border-color: #4a5266;
    }

    .option-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    /* ИСПРАВЛЕННЫЙ СТИЛЬ: фиксирует размер кругляшков и квадратиков */
    .custom-input {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      flex-shrink: 0;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    .option-text {
      font-size: 15px;
      line-height: 1.4;
      flex-grow: 1;
    }

    .badge-status {
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-status.correct { color: var(--correct-green); }
    .badge-status.incorrect { color: var(--incorrect-red); }

    .explanation-text {
      margin-top: 8px;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 8px;
    }

    .option-item.correct-border {
      border-color: var(--correct-green) !important;
      background-color: rgba(16, 185, 129, 0.05);
    }

    .option-item.incorrect-border {
      border-color: var(--incorrect-red) !important;
      background-color: rgba(239, 68, 68, 0.05);
    }

    .option-item.locked { cursor: default; }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
    }

    .left-buttons, .right-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background-color: var(--card-inner);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { background-color: #2b303c; }

    .btn-blue {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn-blue:hover { background-color: var(--accent-hover); }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .results-score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .results-score-title {
      font-size: 16px;
      color: var(--text-secondary);
    }

    .results-score-value {
      font-size: 32px;
      font-weight: bold;
      color: var(--text-primary);
      margin-top: 4px;
    }

    /* Выпадающий список языков */
    .language-select {
      background-color: var(--card-inner);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .language-select:hover {
      background-color: #2b303c;
    }

    .language-select option {
      background-color: var(--card-bg);
      color: var(--text-primary);
    }

    .progress-bar-container {
      height: 12px;
      width: 100%;
      background-color: var(--card-inner);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      margin: 12px 0;
    }

    .bar-segment {
      height: 100%;
      transition: width 0.3s ease;
    }

    .bar-correct { background-color: var(--accent-blue); }
    .bar-incorrect { background-color: var(--incorrect-red); }
    .bar-skipped { background-color: #4b5563; }

    .stats-legend {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot.blue { background-color: var(--accent-blue); }
    .dot.red { background-color: var(--incorrect-red); }
    .dot.gray { background-color: #4b5563; }

    .questions-summary-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }

    .questions-summary-item {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.4;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bottom-box {
      margin-top: 10px;
      background-color: var(--card-inner);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .determinism-info {
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 22px;
      margin-top: 10px;
      line-height: 1.6;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .determinism-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .determinism-info h3 {
      color: var(--text-primary);
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }

    .speech-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speech-btn:hover {
      background-color: var(--accent-hover);
    }

    .determinism-info p {
      margin-bottom: 12px;
    }

    .determinism-info p:last-child {
      margin-bottom: 0;
    }

    .sequence-block {
      background-color: rgba(59, 130, 246, 0.05);
      border-left: 3px solid var(--accent-blue);
      padding: 10px 14px;
      margin: 14px 0;
      color: var(--text-primary);
      font-weight: 500;
      border-radius: 0 8px 8px 0;
    }

    /* Неброская надпись автора */
    .author-credits {
      text-align: center;
      margin-top: 20px;
      padding-top: 10px;
    }

    .author-credits a {
      color: #525866;
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }

    .author-credits a:hover {
      color: var(--accent-blue);
    }
  </style>
</head>
<body>

<!-- АУДИОФАЙЛ ФОНОВОЙ МУЗЫКИ -->
<audio id="bg-music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- АУДИОФАЙЛ ОЗВУЧКИ ИТОГОВОГО ТЕКСТА -->
<audio id="text-speech-audio" preload="auto">
  <source src="text-audio.mp3" type="audio/mpeg">
</audio>

<canvas id="matrix-canvas"></canvas>

<h1 class="main-title">Детерминизм Квиз</h1>

<div class="quiz-card" id="quiz-card"></div>

<script>
  // --- ССЫЛКИ ДЛЯ ВЫПАДАЮЩЕГО СПИСКА ЯЗЫКОВ ---
  const languageLinks = {
    ru: "https://dq-ru/",
    en: "https://dq-en/"
  };

  function openLanguageLink(selectElement) {
    const selectedLang = selectElement.value;
    if (languageLinks[selectedLang]) {
      window.open(languageLinks[selectedLang], '_blank');
    }
  }

  // --- АНИМАЦИЯ МАТРИЦЫ ---
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
  const fontSize = 14;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = 'rgba(15, 17, 23, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = `${fontSize}px monospace`;

    for (let i = 0; i < drops.length; i++) {
      const text = characters.charAt(Math.floor(Math.random() * characters.length));
      const opacity = Math.random() * 0.4 + 0.1; 
      ctx.fillStyle = `rgba(200, 205, 215, ${opacity})`;
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(drawMatrix, 50);

  // --- ДАННЫЕ КВИЗА ---
  const quizData = [
    {
      type: "single",
      question: "Представьте: вы сидите и вдруг решили встать и попить воды. Почему вам кажется, что эта мысль возникла «просто так из ниоткуда»?",
      options: [
        { text: "А. Потому что мозг стёр всю память за секунду до того, как захотелось пить.", explanation: "Память ни при чём. Вы помните, где стакан и где краны с водой, так что прошлый опыт работает вовсю." },
        { text: "В. Наше сознание видит только финальную мысль («Хочу пить!»), а скрытую работу тела (жажду, сухой воздух, усталость) мы не ощущаем.", explanation: "Правильно! Организму потребовалась вода, мозг провел огромную скрытую работу и выдал вам готовый вывод: «Иди попей». Нам кажется это магией, просто потому что мы не чувствуем химию нашего тела.", correct: true },
        { text: "С. В этот момент человек полностью отключился от внешнего мира.", explanation: "Наоборот, возможно, в комнате просто стало жарко или вы увидели стакан на столе — внешняя среда как раз подтолкнула к этому решению." },
        { text: "D. Это абсолютно случайная вспышка в голове, которая никак не связана с вашим телом.", explanation: "Если бы это было случайно, вы с такой же вероятностью могли бы захотеть съесть мыло или выпрыгнуть в окно. Но мозг выдал логичное решение потребностей тела." }
      ]
    },
    {
      type: "single",
      question: "В чём главная разница между понятиями «всё предопределено судьбой» и «у всего есть свои причины»?",
      options: [
        { text: "А. Судьба говорит, что от твоих действий ничего не изменится. А закон причин показывает: твои действия — это и есть причина будущего!", explanation: "Правильно! «Судьба» считает, что если суждено упасть, то упадешь в любом случае. А причинно-следственная связь говорит: если ты будешь смотреть под ноги и подвяжешь шнурки (причина), то не упадешь (следствие). Твои действия действительно меняют всё!", correct: true },
        { text: "В. Вера в судьбу дает свободу выбора, а закон причин её отбирает.", explanation: "Наоборот. Судьба как раз утверждает, что выбор за вас уже сделан свыше." },
        { text: "С. Закон причин говорит, что события происходят случайно.", explanation: "Нет, закон причин как раз доказывает, что у каждого события есть конкретная логическая предыстория." },
        { text: "D. Это абсолютно одно и то же, просто разные слова.", explanation: "Они принципиально разные: судьба делает человека бессильным, а понимание причин дает инструмент менять свою жизнь." }
      ]
    },
    {
      type: "single",
      question: "Вы зашли на маркетплейс и неожиданно для себя купили какую-то ерунду. Какая тут ошибка в рассуждениях: «Я не знаю, зачем я это купил — значит, у моей покупки не было причины»?",
      options: [
        { text: "А. Если вы не знаете причину, значит её действительно нет.", explanation: "То, что вы не знаете, как работает двигатель машины, не значит, что машина едет на магии." },
        { text: "В. Вы путаете «я не знаю причину» с «причины не существует». Причина была (усталость, яркая реклама, скука), просто вы её не осознали.", explanation: "Правильно! Причина была почти наверняка: вы устали после работы, вам красивый баннер подарил дофамин, или вы вспомнили детскую игрушку. Вы просто не успели отследить этот импульс.", correct: true },
        { text: "С. Ошибка в том, что покупки всегда совершает не мозг, а душа.", explanation: "Все наши решения — это физиологические процессы и реакции мозга на раздражители." },
        { text: "D. Покупки всегда происходят абсолютно случайно, как выпадение монетки.", explanation: "Маркетологи зарабатывают миллиарды именно потому, что покупки НЕ случайны, а четко просчитаны через психологические триггеры." }
      ]
    },
    {
      type: "multiple",
      question: "Какие из этих вещей действительно входят в замкнутый круг взаимодействия человека и окружающего мира? (Выберите несколько)",
      options: [
        { text: "А. Получение информации (увидели красивый десерт на витрине).", explanation: "Да! Глаза увидели картинку и передали сигнал в мозг — это первое звено.", correct: true },
        { text: "В. Реакция тела и принятие решения (выделилась слюна, мозг захотел сладостей).", explanation: "Да! Мозг переработал увиденное и сформировал желание — это второе звено.", correct: true },
        { text: "С. Действие и изменение мира (вы купили десерт и съели его).", explanation: "Да! Вы совершили действие, пирожное исчезло, витрина изменилась — это третье звено.", correct: true },
        { text: "D. Полное отключение мозга от законов физики в момент выбора.", explanation: "Нет, мозг ни на микросекунду не выходит из физического мира и продолжает работать по законам природы.", correct: false }
      ]
    },
    {
      type: "single",
      question: "Представьте: монетка подброшена и случайно выпала «орлом». Если в нашем мозге тоже происходят случайные микро-сбои, делает ли это нас свободными и осознанными?",
      options: [
        { text: "А. Да, случайность — это и есть настоящая свобода воли.", explanation: "Если ваша рука случайно дернется и разобьет чашку, разве вы сочтете это «осознанным свободным решением»?" },
        { text: "В. Нет. Если решение произошло случайно (как подброс монетки), вы контролируете его не больше, чем обычную привычку.", explanation: "Правильно! Случайный хаос — это не осознанный выбор. Если вы случайно ляпнете глупость, вы не «проявили свободу воли», а просто столкнулись со случайной ошибкой системы.", correct: true },
        { text: "С. Да, потому что случайность доказывает, что нами никто не управляет.", explanation: "Отсутствие управления не означает появление осознанного «хозяина». Вы все еще не контролируете случайность." },
        { text: "D. Случайности делают человека пассивным неодушевленным камнем.", explanation: "Не делают. Человек остается сложной живой системой, даже если внутри есть небольшая доля вероятностей." }
      ]
    },
    {
      type: "single",
      question: "Зачем нужны правила, законы и штрафы за нарушение ПДД, если человеком управляют причины и мозг?",
      options: [
        { text: "А. Знание о штрафе или тюрьме самó становится мощной причиной, которая удерживает мозг от нарушения.", explanation: "Правильно! Когда водитель знает, что за превышение скорости висит камера (новая информация = причина), его мозг нажимает на педаль тормоза (следствие). Правила реально меняют физическое поведение!", correct: true },
        { text: "В. Законы не имеют смысла, люди всё равно делают только то, что хотят.", explanation: "Законы еще как имеют смысл — они снижают количество преступлений и аварий в разы." },
        { text: "С. Законы работают, только если стирают у людей память.", explanation: "Законы опираются на память людей, а не стирают её." },
        { text: "D. Штрафы нужны только для того, чтобы запутать людей.", explanation: "Штрафы — это информационный инструмент управления поведением огромных масс людей." }
      ]
    },
    {
      type: "multiple",
      question: "Как человек действительно может перестроить свои привычки и изменить поведение в будущем? (Выберите несколько)",
      options: [
        { text: "А. Изменить поступающую информацию (перестать смотреть деструктивный контент, начать читать книги).", explanation: "Да! Новая информация создает новые нейронные связи и меняет то, как мозг будет рассуждать завтра.", correct: true },
        { text: "В. Поменять окружение (убрать с рабочего стола чипсы и телефон).", explanation: "Да! Если нет триггера (причины), мозг не будет отвлекаться и тратить силы на борьбу со соблазном.", correct: true },
        { text: "С. Просто стиснуть зубы и «приказать себе на силе воли» быть другим, ничего не меняя вокруг.", explanation: "Нет! Голая сила воли быстро истощается, если условия, окружение и раздражители остались прежними.", correct: false },
        { text: "D. Поменять круг общения на людей с правильными привычками.", explanation: "Да! Окружение — один из сильнейших факторов, под который наш мозг автоматически подстраивается.", correct: true }
      ]
    },
    {
      type: "single",
      question: "Что происходит в голове у человека в тот момент, когда он говорит: «Я приняла решение пойти учиться»?",
      options: [
        { text: "А. Мозг переработал накопленный опыт, оценки, желания, взвесил плюсы и минусы и выдал команду к действию.", explanation: "Правильно! Фраза «Я решила» — это красивое человеческое название для сложнейшей работы мозга по переработке опыта и выбору наилучшего пути.", correct: true },
        { text: "В. Мысль возникла из полной пустоты, не используя никакие прошлые знания.", explanation: "Если бы знания не использовались, человек не смог бы даже выбрать, куда именно пойти учиться." },
        { text: "С. Человек просто со стороны наблюдал, как его ноги сами пошли подавать документы.", explanation: "Человек — не пассивный зритель, мозг — это активный участник и центр управления процессом." },
        { text: "D. Это всё иллюзия, учеба никак не изменит жизнь человека.", explanation: "Новые знания напрямую меняют квалификацию, действия и будущее человека." }
      ]
    },
    {
      type: "single",
      question: "Два человека опоздали на автобус. Один разразился бранью и испортил себе день, а второй улыбнулся и пошел пить кофе. Почему реакция разная?",
      options: [
        { text: "А. Один умеет выходить из физического мира, а второй — нет.", explanation: "Оба человека живут в одном и том же физическом мире." },
        { text: "В. У них разная «начинка»: разный прошлый опыт, разная усталость, разные установки и уровень стресса.", explanation: "Правильно! Входной сигнал один (автобус уехал), но он попал в два разных «компьютера» с разными программами и прошлым опытом. Поэтому и реакция получилась разной.", correct: true },
        { text: "С. Реакция второго человека абсолютно случайна и ни с чем не связана.", explanation: "Второй человек так отреагировал, потому что, например, хорошо выспался или умеет находить плюсы." },
        { text: "D. Всё дело только в генах, воспитание ничего не решает.", explanation: "Воспитание, привычки и отношение к жизни кардинально меняют то, как мы реагируем на стресс." }
      ]
    },
    {
      type: "single",
      question: "Какой самый главный и полезный вывод нужно сделать из всего этого?",
      options: [
        { text: "А. Перестать пытаться «приказать себе стать новым человеком» на пустом месте. Вместо этого нужно менять окружение и информацию — тогда мозг сам станет действовать иначе!", explanation: "Именно! Если вы хотите начать учиться или худеть, бесполезно просто «хотеть». Нужно убрать соблазны, добавить правильную информацию, настроить условия — и ваш мозг естественным образом выдаст нужные действия!", correct: true },
        { text: "В. Можно вообще ничего не делать, так как всё равно всё решает мозг.", explanation: "Это фаталистическая ошибка. Ваши текущие действия — это как раз то, что формирует ваш мозг на завтра." },
        { text: "С. Нужно перестать читать книги и учиться.", explanation: "Наоборот! Новые книги и знания — это лучший способ загрузить в мозг качественную «программу»." },
        { text: "D. Человек никак не может повлиять на свое будущее.", explanation: "Человек еще как влияет на свое будущее — через осознанное конструирование своего настоящего!" }
      ]
    }
  ];

  let currentQuestion = 0;
  let selectedAnswers = {};
  let isCheckedState = {};
  let showExplanation = true;
  let isMusicPlaying = false;
  let isSpeechPlaying = false;

  function renderQuiz() {
    const quizCard = document.getElementById("quiz-card");

    if (currentQuestion >= quizData.length) {
      renderResults(quizCard);
      return;
    }

    const q = quizData[currentQuestion];
    const isChecked = isCheckedState[currentQuestion] || false;
    const userSelections = selectedAnswers[currentQuestion] || [];

    let optionsHtml = "";
    q.options.forEach((opt, idx) => {
      const isSelected = userSelections.includes(idx);
      const inputType = q.type === "single" ? "radio" : "checkbox";

      let borderClass = "";
      let badgeHtml = "";
      let explanationHtml = "";

      if (isChecked) {
        if (opt.correct) {
          borderClass = "correct-border";
          badgeHtml = `<div class="badge-status correct">✓ ${q.type === 'multiple' ? 'Правильный вариант' : 'Правильно!'}</div>`;
        } else if (isSelected && !opt.correct) {
          borderClass = "incorrect-border";
          badgeHtml = `<div class="badge-status incorrect">✕ ${q.type === 'multiple' ? 'Неверно' : 'Неправильно'}</div>`;
        }

        if (showExplanation) {
          explanationHtml = `<div class="explanation-text">${opt.explanation}</div>`;
        }
      }

      optionsHtml += `
        <div class="option-item ${borderClass} ${isChecked ? 'locked' : ''}" onclick="onOptionClick(${idx})">
          <div class="option-header">
            <input type="${inputType}" name="option" class="custom-input" ${isSelected ? 'checked' : ''} ${isChecked ? 'disabled' : ''}>
            <div class="option-text">${opt.text}</div>
          </div>
          ${badgeHtml}
          ${explanationHtml}
        </div>
      `;
    });

    quizCard.innerHTML = `
      <div class="quiz-header">
        <div class="header-left">
          <button class="music-toggle-btn" onclick="toggleMusic(event)">
            ${isMusicPlaying ? '🔊 Музыка: Вкл' : '🔇 Музыка: Выкл'}
          </button>
          <span>Вопрос ${currentQuestion + 1} из ${quizData.length}</span>
        </div>
        <div class="header-right">
          <select class="language-select" onchange="openLanguageLink(this)">
            <option value="ru" selected>🌐 Рус</option>
            <option value="en">🌐 Eng</option>
          </select>
        </div>
      </div>

      <div class="question-title">${q.question}</div>

      <div class="options-list">
        ${optionsHtml}
      </div>

      <div class="quiz-footer">
        <div class="left-buttons">
          ${isChecked ? `
            <button class="btn" onclick="toggleExplanation()">
              ${showExplanation ? '💬 Скрыть пояснение' : '💬 Пояснение'}
            </button>
          ` : ''}
        </div>
        <div class="right-buttons">
          ${currentQuestion > 0 ? `<button class="btn" onclick="prevQuestion()">Назад</button>` : ''}
          <button class="btn" onclick="goToResults()">Результаты</button>
          <button class="btn btn-blue" onclick="handleNextClick()">Далее</button>
        </div>
      </div>

      <div class="author-credits">
        <a href="https://taplink.cc/max_remaster" target="_blank" rel="noopener noreferrer">by max_remaster</a>
      </div>
    `;
  }

  function onOptionClick(index) {
    if (isCheckedState[currentQuestion]) return;

    const q = quizData[currentQuestion];
    if (!selectedAnswers[currentQuestion]) {
      selectedAnswers[currentQuestion] = [];
    }

    if (q.type === "single") {
      selectedAnswers[currentQuestion] = [index];
    } else {
      const pos = selectedAnswers[currentQuestion].indexOf(index);
      if (pos > -1) {
        selectedAnswers[currentQuestion].splice(pos, 1);
      } else {
        selectedAnswers[currentQuestion].push(index);
      }
    }
    renderQuiz();
  }

  function handleNextClick() {
    const userSelections = selectedAnswers[currentQuestion] || [];

    if (!isCheckedState[currentQuestion]) {
      if (userSelections.length === 0) {
        alert("Пожалуйста, выберите хотя бы один вариант ответа!");
        return;
      }
      isCheckedState[currentQuestion] = true;
      renderQuiz();
    } else {
      currentQuestion++;
      renderQuiz();
    }
  }

  function prevQuestion() {
    if (currentQuestion > 0) {
      currentQuestion--;
      renderQuiz();
    }
  }

  function toggleExplanation() {
    showExplanation = !showExplanation;
    renderQuiz();
  }

  function goToResults() {
    currentQuestion = quizData.length;
    renderQuiz();
  }

  function renderResults(container) {
    let correctCount = 0;
    let incorrectCount = 0;
    let skippedCount = 0;

    quizData.forEach((q, idx) => {
      const userSel = selectedAnswers[idx] || [];
      if (!isCheckedState[idx] && userSel.length === 0) {
        skippedCount++;
        return;
      }

      const correctIndices = q.options.map((opt, i) => opt.correct ? i : null).filter(i => i !== null);
      const isCorrect = userSel.length === correctIndices.length && userSel.every(val => correctIndices.includes(val));

      if (isCorrect) {
        correctCount++;
      } else {
        incorrectCount++;
      }
    });

    const percent = Math.round((correctCount / quizData.length) * 100);

    const questionsListHtml = quizData.map((q, idx) => `
      <div class="questions-summary-item">
        ${idx + 1}. ${q.question}
      </div>
    `).join('');

    container.innerHTML = `
      <div class="results-container">
        <div class="results-score-header">
          <div>
            <div class="results-score-title">Ваши баллы:</div>
            <div class="results-score-value">${correctCount}/${quizData.length} (${percent}%)</div>
          </div>
          
          <select class="language-select" onchange="openLanguageLink(this)">
            <option value="ru" selected>🌐 Рус</option>
            <option value="en">🌐 Eng</option>
          </select>
        </div>

        <div class="progress-bar-container">
          <div class="bar-segment bar-correct" style="width: ${(correctCount / quizData.length) * 100}%"></div>
          <div class="bar-segment bar-incorrect" style="width: ${(incorrectCount / quizData.length) * 100}%"></div>
          <div class="bar-segment bar-skipped" style="width: ${(skippedCount / quizData.length) * 100}%"></div>
        </div>

        <div class="stats-legend">
          <div class="legend-item"><span class="dot blue"></span> Верно (${correctCount})</div>
          <div class="legend-item"><span class="dot red"></span> Неверно (${incorrectCount})</div>
          <div class="legend-item"><span class="dot gray"></span> Пропущено (${skippedCount})</div>
        </div>

        <div class="questions-summary-list">
          ${questionsListHtml}
        </div>

        <div class="bottom-box">
          <span>Повторите попытку</span>
          <button class="btn" onclick="restartQuiz()">🔄 Пройти тест заново</button>
        </div>

        <div class="determinism-info">
          <div class="determinism-header">
            <h3>Архитектура причинности: из чего складывается твой выбор</h3>
            <button class="speech-btn" id="speech-toggle-btn" onclick="toggleSpeech()">
              ${isSpeechPlaying ? '⏸ Пауза озвучки' : '🎧 Озвучить текст'}
            </button>
          </div>
          <p>
            Твой выбор не возникает в момент, когда ты произносишь «я решил». К этому моменту уже существует определённая конфигурация организма: его текущее физиологическое состояние, настроение, память, опыт, сформированные модели, привычки, знания, ожидания и контекст происходящего.
          </p>
          <p>
            Любое новое воздействие входит в эту конфигурацию. Слово, образ, человек, ситуация или собственная мысль могут активировать связанные с ними ассоциации, воспоминания, эмоциональные реакции и модели поведения. Их взаимодействие изменяет дальнейшую обработку информации и вероятность различных действий.
          </p>
          <p>
            Поэтому решение — не отдельное событие, создаваемое независимым субъектом. Это очередное состояние причинной системы.
          </p>
          <p>
            И сам этот тест является частью такой системы. Его вопросы, формулировки, порядок, визуальное оформление и музыка становятся воздействиями на организм. Неоднозначная или даже ошибочная формулировка может вызвать сомнение, раздражение, интерес или сопротивление. Определённое слово может активировать воспоминание, знакомую ассоциацию или привычный способ реагирования. Один человек заметит неточность и начнёт искать другие ошибки, другой её не заметит, а третий решит, что автор просто не заслуживает доверия. Одно и то же воздействие может запускать разные причинные цепочки в зависимости от уже существующей конфигурации организма.
          </p>
          <p>
            Даже визуальное и звуковое оформление способно участвовать в этом процессе. Например, падающие символы, напоминающие «Матрицу», в сочетании с музыкой из начала «Человека-паука 3» могут вызвать удивление, раздражение, юмористическую ассоциацию или воспоминание о фильмах. Эта реакция тоже не возникает сама по себе: её порождает взаимодействие текущих стимулов с памятью, опытом и состоянием организма.
          </p>
          <p>
            То же относится и к результату теста. Можно согласиться с ним, усомниться, начать искать ошибки или почувствовать раздражение. Каждая из этих реакций имеет собственную причинную историю.
          </p>
          
          <div class="sequence-block">
            Получается последовательность:<br>
            предыдущий опыт → текущее состояние → воздействие → интерпретация → реакция → выбор → новый контекст → следующая реакция.
          </div>

          <p>
            Причинная обусловленность при этом не означает неизменность. Новая информация, опыт и изменения среды сами становятся причинами, которые перестраивают систему и влияют на её последующие состояния. Даже понимание собственного детерминизма становится новым причинным фактором.
          </p>
          <p>
            И даже этот текст не находится вне описываемой системы.
          </p>
          <p>
            Ты читаешь определённые слова, связываешь их с уже имеющимися знаниями и опытом, распознаёшь знакомые идеи или сталкиваешься с непривычными формулировками. Одни утверждения могут вызвать согласие, другие — сомнение, интерес, раздражение или сопротивление. Активируются воспоминания, ассоциации и привычные модели реакции.
          </p>
          <p>
            Поэтому даже твоя реакция на этот текст имеет причинную историю.
          </p>
          <p>
            Текст стал воздействием. Воздействие изменило состояние системы. Изменённое состояние повлияло на последующее восприятие и поведение.
          </p>
          <p>
            И теперь следующий выбор будет совершаться уже немного другой системой.
          </p>
          <p>
            <strong>В том числе прямо сейчас.</strong>
          </p>
        </div>

        <div class="author-credits">
          <a href="https://taplink.cc/max_remaster" target="_blank" rel="noopener noreferrer">by max_remaster</a>
        </div>
      </div>
    `;
  }

  function restartQuiz() {
    currentQuestion = 0;
    selectedAnswers = {};
    isCheckedState = {};
    
    // Останавливаем озвучку при перезапуске
    const speechAudio = document.getElementById('text-speech-audio');
    speechAudio.pause();
    speechAudio.currentTime = 0;
    isSpeechPlaying = false;

    renderQuiz();
  }

  // --- УПРАВЛЕНИЕ МУЗЫКОЙ ---
  const bgMusic = document.getElementById('bg-music');
  bgMusic.volume = 0.3;

  function startMusic() {
    bgMusic.play().then(() => {
      isMusicPlaying = true;
      updateMusicButton();
    }).catch(() => {
      isMusicPlaying = false;
      document.addEventListener('click', () => {
        if (!isMusicPlaying) {
          bgMusic.play();
          isMusicPlaying = true;
          updateMusicButton();
        }
      }, { once: true });
    });
  }

  function toggleMusic(e) {
    if (e) e.stopPropagation();
    if (isMusicPlaying) {
      bgMusic.pause();
      isMusicPlaying = false;
    } else {
      bgMusic.play();
      isMusicPlaying = true;
    }
    updateMusicButton();
  }

  function updateMusicButton() {
    const btn = document.querySelector('.music-toggle-btn');
    if (btn) {
      btn.innerText = isMusicPlaying ? '🔊 Музыка: Вкл' : '🔇 Музыка: Выкл';
    }
  }

  // --- УПРАВЛЕНИЕ ОЗВУЧКОЙ ТЕКСТА ---
  function toggleSpeech() {
    const speechAudio = document.getElementById('text-speech-audio');
    const speechBtn = document.getElementById('speech-toggle-btn');

    if (isSpeechPlaying) {
      speechAudio.pause();
      isSpeechPlaying = false;
      if (speechBtn) speechBtn.innerText = '🎧 Озвучить текст';
    } else {
      speechAudio.play().then(() => {
        isSpeechPlaying = true;
        if (speechBtn) speechBtn.innerText = '⏸ Пауза озвучки';
      }).catch(err => {
        alert("Не удалось воспроизвести файл озвучки text-audio.mp3. Проверьте, добавлен ли файл в папку.");
      });
    }

    speechAudio.onended = () => {
      isSpeechPlaying = false;
      if (speechBtn) speechBtn.innerText = '🎧 Озвучить текст';
    };
  }

  renderQuiz();
  startMusic();
</script>

</body>
</html>
